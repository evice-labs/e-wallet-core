name: CI (Linux)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Nix Build and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Verify FFI dynamic library headers and symbols
        run: |
          nm -D lib/x86_64-linux/liblez_wallet_sdk.so | grep -q "lez_wallet_engine_new" || {
            echo "Error: Required FFI symbols not found in vendored library"
            exit 1
          }
          echo "Vendored C-ABI FFI symbols verified."

      - name: Build Core Module Package (LIDL, MOC, Plugin)
        run: |
          nix build .# --no-link -L

      - name: Compile and Execute Integration Test Suite
        run: |
          nix develop --command bash -c "g++ -std=c++20 tests/test_e_wallet_core.cpp src/*.cpp -Isrc -Ilib -I\$LOGOS_CPP_SDK_ROOT/include -Llib -llez_wallet_sdk -lpcsclite -Wl,-rpath,lib -o tests/test_e_wallet_core_runner && ./tests/test_e_wallet_core_runner && rm tests/test_e_wallet_core_runner"
