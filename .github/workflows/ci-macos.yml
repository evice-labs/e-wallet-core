name: CI (macOS)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nix-module-build-macos:
    name: macOS Nix Module Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build Core Module Package (macOS)
        run: |
          nix build .# -L -o result

      # A plugin linked without the SDK still builds on macOS (unresolved
      # symbols are left for load time), so check that it actually loads.
      - name: Check the plugin loads with the bundled SDK
        run: |
          file -L result/lib/liblez_wallet_sdk.dylib | grep -q 'Mach-O 64-bit dynamically linked shared library arm64'
          python3 -c 'import ctypes; ctypes.CDLL("result/lib/e_wallet_core_plugin.dylib"); print("plugin loads")'
