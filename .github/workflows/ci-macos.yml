name: CI (macOS)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nix-module-build-macos:
    name: macOS Nix Module Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build Core Module Package (macOS)
        run: |
          nix build .# --no-link -L
